version: '3.8'

services:
  legendkeeper-mcp:
    image: ghcr.io/chase-roohms/legendkeeper-mcp:latest
    container_name: legendkeeper-mcp
    restart: unless-stopped
    env_file: LegendKeeperMCP/.env
    environment:
      MCP_TRANSPORT: http
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in LegendKeeperMCP/.env}
    ports:
      - "8000:8000"
    volumes:
      - ./LegendKeeperMCP/uploads:/uploads:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  librarian:
    build:
      context: ../librarian
      dockerfile: Dockerfile
    container_name: librarian
    restart: unless-stopped
    env_file: .env
    ports:
      - "8090:8090"
    volumes:
      - ./librarian-data:/data
      - ${VAULTS_DIR:-./vaults}:/vaults:ro
    environment:
      - ALX_DATA_DIR=/data
      - ALX_VAULTS_DIR=/vaults
      - LIBRARIAN_PORT=${LIBRARIAN_PORT:-8090}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-}
      - ALX_CORS_ORIGINS=${ALX_CORS_ORIGINS:-}
    depends_on:
      - legendkeeper-mcp

