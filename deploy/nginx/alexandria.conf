# nginx site for Alexandria on a domain. Copy to /etc/nginx/sites-available/,
# replace table.example.com with your own name, link it into sites-enabled/ and
# get a certificate with certbot (see docs/QUICKSTART.md):
#
#   sudo cp deploy/nginx/alexandria.conf /etc/nginx/sites-available/alexandria.conf
#   sudo sed -i 's/table.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/alexandria.conf
#   sudo ln -s /etc/nginx/sites-available/alexandria.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d YOUR.DOMAIN   # before the 443 block can load
#   sudo nginx -t && sudo systemctl reload nginx
#
# Alexandria listens on 127.0.0.1:8090 (deploy/examples/nginx.override.yml
# publishes it there only). Set in librarian/.env:
#   ALX_TRUST_PROXY=1
#   ALX_PUBLIC_URL=https://YOUR.DOMAIN
#
# The only long-lived stream is the live-update feed (Server-Sent Events, GET
# /api/worlds/<world>/events). Nothing uses WebSockets. The MCP endpoint (/mcp)
# is request/response but can answer as a stream, so it is left unbuffered too.
#
# For a LAN or a test with no certificate use alexandria.http.conf instead.

server {
    listen 80;
    server_name table.example.com;

    # certbot --webroot renewals
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name table.example.com;

    ssl_certificate     /etc/letsencrypt/live/table.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/table.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Video and audio uploads go straight to disk on the server.
    client_max_body_size 2g;
    client_body_timeout  300s;
    send_timeout         300s;

    # The live feed: no buffering, no cache, one connection kept for hours.
    location ~ ^/api/worlds/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # The MCP endpoint (AI apps): can answer as a stream too.
    location /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Everything else: the app, the API, library files, uploads.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;   # big uploads are not spooled to nginx's disk first
        proxy_read_timeout 600s;       # long model calls, transcription, big downloads
        proxy_send_timeout 600s;
    }
}
