# Plain-HTTP nginx site for a LAN or a test (no certificate). Do not expose this
# to the internet: passwords and keys would travel unencrypted. Phones can only
# add a shortcut on plain HTTP, not install the app (installing needs HTTPS).
#
#   sudo cp deploy/nginx/alexandria.http.conf /etc/nginx/conf.d/alexandria.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# In librarian/.env: ALX_TRUST_PROXY=1 and ALX_PUBLIC_URL=http://dnd.example.com
# (or the LAN address). Alexandria listens on 127.0.0.1:8090.
server {
    listen 80 default_server;
    server_name dnd.example.com _;

    client_max_body_size 2g;
    client_body_timeout  300s;
    send_timeout         300s;

    location ~ ^/api/worlds/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
