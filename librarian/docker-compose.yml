# Alexandria librarian
services:
  librarian:
    build: .
    ports:
      - "${LIBRARIAN_PORT:-8090}:8090"
    env_file: .env
    environment:
      ALX_DATA_DIR: /data
      ALX_VAULTS_DIR: /vaults
    volumes:
      - ./data:/data
      # Folders of Markdown (Obsidian, Lokus, Otterly vaults) the admin may add as sources
      - ${VAULTS_DIR:-./vaults}:/vaults:ro
    restart: unless-stopped
