# Alexandria in one container: open http://localhost:8090
services:
  alexandria:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    ports:
      - "${LIBRARIAN_PORT:-8090}:8090"
    env_file:
      - path: librarian/.env
        required: false
    environment:
      ALX_DATA_DIR: /data
      ALX_VAULTS_DIR: /vaults
    volumes:
      - ./data:/data
      - ${VAULTS_DIR:-./vaults}:/vaults:ro
    restart: unless-stopped
