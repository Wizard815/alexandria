# Alexandria in one container: open http://localhost:8090
services:
  alexandria:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        ALX_VERSION: ${ALX_VERSION:-0.1.0-alpha.1}
        ALX_RELEASE: ${ALX_RELEASE:-AlphaV1}
    ports:
      - "${LIBRARIAN_PORT:-8090}:8090"
    env_file:
      - path: librarian/.env
        required: false
    environment:
      ALX_DATA_DIR: /data
      ALX_VAULTS_DIR: /vaults
    volumes:
      - ./data:/data
      - ${VAULTS_DIR:-./vaults}:/vaults:ro
    restart: unless-stopped
    # Give the server time to close the database cleanly on `docker compose stop`.
    stop_grace_period: 30s
    # Recommended: 2 GB of RAM for the container (4 GB for a library of several thousand pages with embeddings). Uncomment to enforce:
    # mem_limit: 3g
